[package]
name = "task_manager"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
eframe = "0.22"
egui = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.11", features = ["json", "native-tls", "stream"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
regex = "1.10"
log = "0.4"
parking_lot = "0.12"
futures-util = "0.3"
dirs = "4.0"
# Fix for eframe 0.22 winapi feature issue on Windows
winapi = { version = "0.3", features = ["winuser"] }

[[bin]]
name = "task_manager_service"
path = "src/bin/service.rs"

[[bin]]
name = "task_manager_gui"
path = "src/bin/gui.rs"

[profile.release]
opt-level = 3
lto = true
